server.port=8080

# MySQL. createDatabaseIfNotExist=true creates the schema on first run, so
# there is nothing to set up by hand.
#
# Its own database, deliberately: the older build in "project 1" uses
# `roommates`, and its tables predate the gender, area, sharing, verified and
# photo columns. Pointing both at one schema would leave those columns NULL on
# the existing rows and stop the seed data here from ever running.
spring.datasource.url=jdbc:mysql://localhost:3306/roommates3?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=roommate123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates and updates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Set to true while developing if you want to see the generated SQL.
spring.jpa.show-sql=false

# Photo uploads. This folder is NOT served statically: photos only leave
# through GET /api/photo/{id}, which checks consent on the blockchain first.
photo.dir=./data/photos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Where the Python matching service is running
ml.url=http://localhost:8000

# Hardhat local node, and the contract address printed by the deploy script
chain.rpc=http://127.0.0.1:8545
chain.contract=0x5FbDB2315678afecb367f032d93F642f64180aa3
