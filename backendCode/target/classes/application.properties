server.port=8080

# MySQL. Create the database once before starting:
#   CREATE DATABASE roommates;
# createDatabaseIfNotExist=true also handles it for you on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/roommates?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=roommate123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates and updates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Set to true while developing if you want to see the generated SQL.
spring.jpa.show-sql=false

# Where the Python matching service is running
ml.url=http://localhost:8000

# Hardhat local node, and the contract address printed by the deploy script
chain.rpc=http://127.0.0.1:8545
chain.contract=0x5FbDB2315678afecb367f032d93F642f64180aa3
